<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Caveat:wght@400;500;600;700&family=Itim&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Mali:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Playwrite+VN:wght@100..400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Floating Background Music Controller Widget -->
  <div class="bgm-widget" id="bgm-widget" title="Nhạc nền: A Story About Us - BigRicePiano">
    <button class="bgm-btn" id="bgm-toggle-btn" aria-label="Bật/Tắt nhạc nền">
      <div class="bgm-vinyl">
        <span class="bgm-icon">🎵</span>
      </div>
      <div class="bgm-info">
        <span class="bgm-title">A Story About Us</span>
        <span class="bgm-artist">BigRicePiano</span>
      </div>
      <div class="bgm-equalizer">
        <span class="eq-bar bar-1"></span>
        <span class="eq-bar bar-2"></span>
        <span class="eq-bar bar-3"></span>
        <span class="eq-bar bar-4"></span>
      </div>
    </button>
  </div>

  <audio id="bgm-audio" loop preload="auto">
    <source src="audio/bgm.webm" type="audio/webm">
    <source src="audio/bgm.m4a" type="audio/mp4">
    <source src="audio/bgm.mp3" type="audio/mpeg">
  </audio>

  <main class="artwork-viewport">
    <svg class="svg-canvas is-lit" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"
      preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Background radial ambient gradient -->
        <radialGradient id="bg-ambient" cx="50%" cy="50%" r="75%" fx="45%" fy="45%">
          <stop offset="0%" stop-color="#19232f" />
          <stop offset="35%" stop-color="#121a24" />
          <stop offset="70%" stop-color="#0b1016" />
          <stop offset="100%" stop-color="#06090d" />
        </radialGradient>

        <!-- Wall soft center moonlight / room glow -->
        <radialGradient id="wall-ambient-glow" cx="52%" cy="52%" r="45%">
          <stop offset="0%" stop-color="#1d2b3b" stop-opacity="0.65" />
          <stop offset="50%" stop-color="#131c26" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#0b1016" stop-opacity="0" />
        </radialGradient>

        <!-- Window exterior moonlit night sky -->
        <linearGradient id="sky-gradient" x1="0%" y1="0%" x2="70%" y2="100%">
          <stop offset="0%" stop-color="#15243b" />
          <stop offset="30%" stop-color="#1d3353" />
          <stop offset="70%" stop-color="#2a4a75" />
          <stop offset="100%" stop-color="#386094" />
        </linearGradient>

        <!-- Moonlight diagonal volumetric rays -->
        <linearGradient id="moonlight-diagonal-ray" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#76a8d8" stop-opacity="0.32" />
          <stop offset="35%" stop-color="#507fae" stop-opacity="0.18" />
          <stop offset="70%" stop-color="#2d4f74" stop-opacity="0.06" />
          <stop offset="100%" stop-color="#182d44" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="moonlight-sheer-ray" x1="0%" y1="0%" x2="100%" y2="80%">
          <stop offset="0%" stop-color="#8bb7e2" stop-opacity="0.28" />
          <stop offset="40%" stop-color="#5584b2" stop-opacity="0.14" />
          <stop offset="100%" stop-color="#203854" stop-opacity="0" />
        </linearGradient>

        <!-- Sheer Curtains Gradients -->
        <linearGradient id="curtain-base" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1c2d42" stop-opacity="0.88" />
          <stop offset="30%" stop-color="#2b4363" stop-opacity="0.75" />
          <stop offset="70%" stop-color="#1a2b40" stop-opacity="0.88" />
          <stop offset="100%" stop-color="#111d2c" stop-opacity="0.95" />
        </linearGradient>

        <linearGradient id="curtain-fold-mid" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#365377" stop-opacity="0.6" />
          <stop offset="30%" stop-color="#537ca9" stop-opacity="0.45" />
          <stop offset="65%" stop-color="#2c4566" stop-opacity="0.65" />
          <stop offset="100%" stop-color="#1d3047" stop-opacity="0.8" />
        </linearGradient>

        <linearGradient id="curtain-sheer-layer" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#658eb5" stop-opacity="0.35" />
          <stop offset="45%" stop-color="#94c0eb" stop-opacity="0.22" />
          <stop offset="75%" stop-color="#527fa8" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#284462" stop-opacity="0.45" />
        </linearGradient>

        <!-- Table Wood Planks Gradients -->
        <linearGradient id="table-plank-1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#1d2735" />
          <stop offset="40%" stop-color="#16202b" />
          <stop offset="100%" stop-color="#0f151e" />
        </linearGradient>

        <linearGradient id="table-plank-2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#243242" />
          <stop offset="35%" stop-color="#1b2633" />
          <stop offset="100%" stop-color="#111821" />
        </linearGradient>

        <linearGradient id="table-plank-3" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#29394b" />
          <stop offset="35%" stop-color="#1f2b38" />
          <stop offset="100%" stop-color="#131a23" />
        </linearGradient>

        <linearGradient id="table-plank-4" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#2e3f52" />
          <stop offset="35%" stop-color="#22303e" />
          <stop offset="100%" stop-color="#141c25" />
        </linearGradient>

        <linearGradient id="table-plank-5" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#34465b" />
          <stop offset="35%" stop-color="#263443" />
          <stop offset="100%" stop-color="#161f29" />
        </linearGradient>

        <!-- Candle Wax Gradients -->
        <linearGradient id="candle-wax-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#c5c9ce" />
          <stop offset="30%" stop-color="#e2e5e8" />
          <stop offset="70%" stop-color="#b8bcc2" />
          <stop offset="100%" stop-color="#8a9096" />
        </linearGradient>

        <!-- Brass Candlestick Gradients -->
        <linearGradient id="brass-saucer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#555d44" />
          <stop offset="35%" stop-color="#717c5b" />
          <stop offset="70%" stop-color="#464e39" />
          <stop offset="100%" stop-color="#262b1e" />
        </linearGradient>

        <linearGradient id="brass-stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#4d563d" />
          <stop offset="40%" stop-color="#778261" />
          <stop offset="80%" stop-color="#3d442f" />
          <stop offset="100%" stop-color="#202518" />
        </linearGradient>

        <!-- Memory Box Gradients -->
        <linearGradient id="box-lid-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#697788" />
          <stop offset="45%" stop-color="#586574" />
          <stop offset="100%" stop-color="#46515e" />
        </linearGradient>

        <linearGradient id="box-lid-rim-front" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#4f5966" />
          <stop offset="50%" stop-color="#424c58" />
          <stop offset="100%" stop-color="#343c46" />
        </linearGradient>

        <linearGradient id="box-lid-rim-side" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#2d353e" />
          <stop offset="100%" stop-color="#1f252c" />
        </linearGradient>

        <linearGradient id="box-body-front-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#46505c" />
          <stop offset="55%" stop-color="#3b4450" />
          <stop offset="100%" stop-color="#2e3640" />
        </linearGradient>

        <linearGradient id="box-body-side-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#2a313a" />
          <stop offset="100%" stop-color="#1c2228" />
        </linearGradient>

        <linearGradient id="box-cavity-inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#100b18" />
          <stop offset="50%" stop-color="#191226" />
          <stop offset="100%" stop-color="#0a0710" />
        </linearGradient>

        <radialGradient id="box-lid-landed-shadow-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#070a0e" stop-opacity="0.95" />
          <stop offset="50%" stop-color="#090d13" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#0b1016" stop-opacity="0" />
        </radialGradient>

        <!-- Kerosene lamp glass chimney gradient -->
        <linearGradient id="glass-chimney-grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#2e4258" stop-opacity="0.4" />
          <stop offset="35%" stop-color="#6084ab" stop-opacity="0.3" />
          <stop offset="70%" stop-color="#283c50" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#162332" stop-opacity="0.75" />
        </linearGradient>

        <!-- Warm Candlelight Illumination Gradients -->
        <radialGradient id="candle-wall-lit-glow" cx="815" cy="430" r="620" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffa034" stop-opacity="0.75" />
          <stop offset="30%" stop-color="#e26612" stop-opacity="0.45" />
          <stop offset="65%" stop-color="#7a2806" stop-opacity="0.15" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="table-lit-wood-glow" cx="770" cy="735" rx="480" ry="130" fx="800" fy="725"
          gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffb048" stop-opacity="0.9" />
          <stop offset="35%" stop-color="#d46815" stop-opacity="0.65" />
          <stop offset="70%" stop-color="#782d08" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#141c26" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="box-lit-face-glow" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffb862" stop-opacity="0.45" />
          <stop offset="55%" stop-color="#cf6815" stop-opacity="0.18" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="box-lid-top-lit-glow" x1="0%" y1="60%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffb862" stop-opacity="0.48" />
          <stop offset="40%" stop-color="#d46815" stop-opacity="0.22" />
          <stop offset="80%" stop-color="#782d08" stop-opacity="0.06" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="box-lid-rim-lit-glow" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffb862" stop-opacity="0.45" />
          <stop offset="55%" stop-color="#cf6815" stop-opacity="0.18" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </linearGradient>

        <!-- Flame Gradients -->
        <radialGradient id="flame-glow-halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
          <stop offset="25%" stop-color="#ffe885" stop-opacity="0.75" />
          <stop offset="60%" stop-color="#ff8e1a" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#d44a00" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="flame-outer-grad" x1="50%" y1="100%" x2="50%" y2="0%">
          <stop offset="0%" stop-color="#e04800" />
          <stop offset="25%" stop-color="#ff7b00" />
          <stop offset="65%" stop-color="#ffc83b" />
          <stop offset="100%" stop-color="#fff9d6" />
        </linearGradient>

        <linearGradient id="flame-inner-grad" x1="50%" y1="100%" x2="50%" y2="0%">
          <stop offset="0%" stop-color="#ffe67a" />
          <stop offset="40%" stop-color="#fff8d1" />
          <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>

        <!-- Cosmic Open Box & Burst Gradients -->
        <radialGradient id="box-interior-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="25%" stop-color="#84f6ff" stop-opacity="0.95" />
          <stop offset="55%" stop-color="#ff7ce5" stop-opacity="0.7" />
          <stop offset="85%" stop-color="#8a4dff" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#14101a" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="box-volumetric-beam-grad" x1="50%" y1="100%" x2="50%" y2="0%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
          <stop offset="20%" stop-color="#7df1ff" stop-opacity="0.55" />
          <stop offset="55%" stop-color="#ff7ad9" stop-opacity="0.3" />
          <stop offset="85%" stop-color="#9455ff" stop-opacity="0.12" />
          <stop offset="100%" stop-color="#1b2a4a" stop-opacity="0" />
        </linearGradient>

        <radialGradient id="box-room-cosmic-glow-grad" cx="55%" cy="55%" r="55%">
          <stop offset="0%" stop-color="#7bf5ff" stop-opacity="0.45" />
          <stop offset="35%" stop-color="#e96eff" stop-opacity="0.25" />
          <stop offset="70%" stop-color="#512b9e" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="box-table-cosmic-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#b6f7ff" stop-opacity="0.8" />
          <stop offset="40%" stop-color="#f87eff" stop-opacity="0.45" />
          <stop offset="80%" stop-color="#4e2c94" stop-opacity="0.15" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>

        <!-- Open Cardboard Flaps Gradients -->
        <linearGradient id="box-flap-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7a624f" />
          <stop offset="60%" stop-color="#5f4a3a" />
          <stop offset="100%" stop-color="#463629" />
        </linearGradient>

        <linearGradient id="box-flap-right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8d7360" />
          <stop offset="60%" stop-color="#6e5746" />
          <stop offset="100%" stop-color="#4a392d" />
        </linearGradient>

        <linearGradient id="box-flap-back-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#695343" />
          <stop offset="100%" stop-color="#3c2f25" />
        </linearGradient>

        <!-- Table Top Polygon Clip Path to keep candlelight naturally on wood -->
        <clipPath id="table-top-clip">
          <polygon points="585,650 1415,650 1375,828 340,788" />
        </clipPath>

        <!-- Subtle blur filters for authentic shadows & soft glow -->
        <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8" />
        </filter>
        <filter id="flame-soft-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="16" />
        </filter>
        <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" />
        </filter>

        <!-- Floating Card Magic Aura Gradient & Filter -->
        <radialGradient id="card-aura-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
          <stop offset="30%" stop-color="#7df1ff" stop-opacity="0.75" />
          <stop offset="65%" stop-color="#ff7ce5" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#9455ff" stop-opacity="0" />
        </radialGradient>
        <filter id="card-magic-glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- ====================================================================
           LAYER 1: Room Backdrop & Wall Lighting
           ==================================================================== -->
      <g id="layer-room-background">
        <!-- Base Wall Background -->
        <rect width="1920" height="1080" fill="url(#bg-ambient)" />

        <!-- Soft Ambient Light Glow on Center Wall -->
        <circle cx="1060" cy="540" r="620" fill="url(#wall-ambient-glow)" />

        <!-- Warm Candle Wall Glow (Active when candle is lit) -->
        <circle id="flame-wall-glow" class="candle-lit-layer" cx="815" cy="430" r="620"
          fill="url(#candle-wall-lit-glow)" />

        <!-- Ethereal Cosmic Room Glow (Active when memory box is open) -->
        <circle id="box-room-cosmic-glow" class="box-open-layer" cx="1105" cy="540" r="750"
          fill="url(#box-room-cosmic-glow-grad)" />

        <!-- Left corner wall shadow -->
        <polygon points="0,0 120,0 120,1080 0,1080" fill="#06090d" opacity="0.6" />
      </g>

      <!-- ====================================================================
           LAYER 2: Moonlit Window & Exterior Night
           ==================================================================== -->
      <g id="layer-window">
        <!-- Window Outer Wall Casing -->
        <polygon points="110,0 390,0 390,740 110,740" fill="#080c12" />

        <!-- Window Jamb / Depth Reveals -->
        <polygon points="110,0 145,0 145,670 110,670" fill="#0e151f" />
        <polygon points="110,0 390,0 355,0 145,0" fill="#0b1017" />
        <polygon points="355,0 390,0 390,670 355,670" fill="#070a0f" />

        <!-- Window Glass / Sky Cutout -->
        <rect x="145" y="0" width="210" height="670" fill="url(#sky-gradient)" />

        <!-- Distant Night Haze / Silhouetted Outdoors -->
        <path d="M 145 220 Q 250 200 355 240 L 355 670 L 145 670 Z" fill="#13233b" opacity="0.6" />
        <path d="M 145 380 Q 240 350 355 400 L 355 670 L 145 670 Z" fill="#0f1d32" opacity="0.75" />

        <!-- Center Vertical Window Frame Muntin -->
        <rect x="242" y="0" width="16" height="670" fill="#0a1017" />
        <line x1="242" y1="0" x2="242" y2="670" stroke="#16202d" stroke-width="1.5" />
        <line x1="258" y1="0" x2="258" y2="670" stroke="#05080c" stroke-width="1.5" />

        <!-- Horizontal Window Frame Muntins -->
        <!-- Row 1 -->
        <rect x="145" y="85" width="210" height="14" fill="#0a1017" />
        <line x1="145" y1="85" x2="355" y2="85" stroke="#192433" stroke-width="1.5" />
        <line x1="145" y1="99" x2="355" y2="99" stroke="#05080c" stroke-width="1.5" />

        <!-- Row 2 -->
        <rect x="145" y="335" width="210" height="15" fill="#0a1017" />
        <line x1="145" y1="335" x2="355" y2="335" stroke="#1c2838" stroke-width="1.5" />
        <line x1="145" y1="350" x2="355" y2="350" stroke="#05080c" stroke-width="1.5" />

        <!-- Row 3 -->
        <rect x="145" y="580" width="210" height="15" fill="#0a1017" />
        <line x1="145" y1="580" x2="355" y2="580" stroke="#1e2a3b" stroke-width="1.5" />
        <line x1="145" y1="595" x2="355" y2="595" stroke="#05080c" stroke-width="1.5" />

        <!-- Window Sill (Sturdy wooden sill projecting into room) -->
        <!-- Top moonlit face of sill -->
        <polygon points="90,665 410,665 400,695 95,695" fill="#182536" />
        <line x1="90" y1="665" x2="410" y2="665" stroke="#385274" stroke-width="2" />
        <!-- Front apron face of sill -->
        <polygon points="95,695 400,695 395,735 100,735" fill="#0f1620" />
        <line x1="100" y1="735" x2="395" y2="735" stroke="#06090d" stroke-width="2" />
        <!-- Sill under shadow -->
        <polygon points="95,735 395,735 385,765 105,765" fill="#06090d" opacity="0.85" />

        <!-- Soft Volumetric Moonbeam streaming across room -->
        <polygon points="145,0 355,0 720,1080 200,1080" fill="url(#moonlight-diagonal-ray)" />
      </g>

      <!-- ====================================================================
           LAYER 3: Sheer Flowing Curtains (Drapery)
           ==================================================================== -->
      <g id="layer-curtains">
        <!-- Leftmost deep dark curtain layer -->
        <path d="M 50 0 C 75 180, 85 380, 75 620 C 65 820, 90 960, 110 1080 L 0 1080 L 0 0 Z"
          fill="url(#curtain-base)" />

        <!-- Main flowing sheer drape over window (Layer 1) -->
        <path
          d="M 105 0 C 130 150, 150 320, 145 520 C 140 700, 170 880, 190 1080 L 105 1080 C 90 950, 70 750, 80 520 C 90 320, 75 150, 65 0 Z"
          fill="url(#curtain-fold-mid)" />

        <!-- Translucent Billow Fold across window glass (Layer 2) -->
        <path
          d="M 145 0 C 190 180, 230 380, 235 600 C 240 780, 220 940, 215 1080 L 155 1080 C 165 920, 180 760, 175 580 C 170 400, 145 200, 125 0 Z"
          fill="url(#curtain-sheer-layer)" />

        <!-- Broad soft drape extending to the right edge of window (Layer 3) -->
        <path
          d="M 210 0 C 270 160, 315 340, 330 550 C 345 740, 315 920, 300 1080 L 240 1080 C 260 920, 285 750, 275 560 C 265 380, 230 180, 190 0 Z"
          fill="url(#curtain-sheer-layer)" />

        <!-- Outer sheer edge fluttering softly into room (Layer 4) -->
        <path
          d="M 275 0 C 335 180, 390 360, 405 570 C 415 720, 380 890, 360 1080 L 310 1080 C 335 910, 365 740, 355 580 C 345 400, 305 200, 260 0 Z"
          fill="url(#curtain-sheer-layer)" opacity="0.8" />

        <!-- Trailing soft sheer mist edge -->
        <path
          d="M 345 0 C 405 200, 470 420, 480 640 C 490 780, 445 940, 415 1080 L 375 1080 C 405 930, 440 780, 430 630 C 420 450, 370 220, 325 0 Z"

                      <ellipse cx="120" cy="165" rx="8" ry="4" fill="#a8cca8" transform="rotate(-15 120 165)" />
                      <!-- Tiny buds -->
                      <circle cx="130" cy="158" r="4.5" fill="#d4b8e8" />
                      <circle cx="142" cy="162" r="4" fill="#a4c8e8" />
                    </g>
                  </svg>
                </div>

                <!-- Top & Right mini planet stickers -->
                <div class="mini-stationery-stickers">
                  <span class="sticker-planet">🪐</span>
                  <span class="sticker-star">✨</span>
                </div>

                <!-- Lined Letter Body -->
                <div class="letter-content-box">
                  <div class="letter-lines-wrapper">
                    <p class="letter-salutation" data-text="Gửi Lâm Oanh thân mến,"></p>
                    <p class="letter-body-line"
                      data-text="Chúc bạn có một ngày sinh nhật ngập tràn niềm vui, tiếng cười và những điều ngọt ngào nhất!">
                    </p>
                    <p class="letter-body-line"
                      data-text="Bước sang tuổi mới, chúc bạn luôn rạng rỡ và tỏa sáng như những vì sao trên bầu trời.">
                    </p>
                    <p class="letter-body-line"
                      data-text="Mong rằng mọi ước nguyện, đam mê và dự định của bạn đều sẽ sớm trở thành hiện thực.">
                    </p>
                    <p class="letter-closing" data-text="Happy Birthday to You! ✨🎂"></p>
                  </div>
                </div>

                <!-- Bottom Right Mini Polaroid & Ticket Pin -->
                <div class="polaroid-pin polaroid-bottom-right">
                  <div class="polaroid-photo">
                    <img src="images/polaroid_3.jpg" alt="Kỷ niệm đẹp 3" />
                  </div>
                  <div class="vintage-ticket-tag">TICKET</div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="sound-effects.js"></script>
  <script src="magic-particles.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const svg = document.querySelector('.svg-canvas');
      const candle = document.getElementById('layer-candlestick');
      const box = document.getElementById('layer-memory-box');
      const smoke = document.getElementById('candle-smoke');
      const ember = document.getElementById('candle-ember');
      const bubble = document.getElementById('box-speech-bubble');
      const floatingCard = document.getElementById('floating-box-card');
      const cardModal = document.getElementById('birthday-card-modal');
      const card3D = document.getElementById('greeting-card-3d');
      const closeCardBtn = document.getElementById('close-card-btn');
      const cosmicEngine = new CosmicParticleEngine('magic-cosmic-canvas');
      let bubbleTimer = null;

      function showSpeechBubble() {
        if (!bubble) return;
        bubble.classList.remove('is-visible');
        void bubble.offsetWidth; // trigger reflow
        bubble.classList.add('is-visible');

        if (bubbleTimer) clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(() => {
          bubble.classList.remove('is-visible');
        }, 3200);
      }

      function hideSpeechBubble() {
        if (bubble) bubble.classList.remove('is-visible');
        if (bubbleTimer) clearTimeout(bubbleTimer);
      }

      // Typewriter Effect for Birthday Letter
      const letterElements = [
        document.querySelector('.letter-salutation'),
        ...document.querySelectorAll('.letter-body-line'),
        document.querySelector('.letter-closing')
      ].filter(Boolean);

      let typewriterTimeouts = [];

      function cancelTypewriter() {
        typewriterTimeouts.forEach(t => clearTimeout(t));
        typewriterTimeouts = [];
        letterElements.forEach(el => {
          el.classList.remove('typing-active');
          el.textContent = '';
        });
      }

      function startTypewriter() {
        cancelTypewriter();

        let cumulativeDelay = 450; // Initial delay while book flap is opening

        letterElements.forEach((el, elIndex) => {
          const text = el.getAttribute('data-text') || '';
          if (!text) return;

          const startTimeout = setTimeout(() => {
            letterElements.forEach(item => item.classList.remove('typing-active'));
            el.classList.add('typing-active');
            el.textContent = '';

            let charIndex = 0;
            function typeNextChar() {
              if (charIndex < text.length) {
                const char = text.charAt(charIndex);
                el.textContent += char;
                charIndex++;

                if (window.soundEngine) {
                  window.soundEngine.playTypewriterKey(char);
                }

                let charSpeed = 26;
                if (char === ',' || char === '.') charSpeed = 130;
                else if (char === '!' || char === '?') charSpeed = 180;
                else if (char === ' ') charSpeed = 35;

                const nextTimeout = setTimeout(typeNextChar, charSpeed);
                typewriterTimeouts.push(nextTimeout);
              } else {
                if (elIndex === letterElements.length - 1) {
                  if (window.soundEngine) {
                    window.soundEngine.playTypewriterBell();
                  }
                  const doneTimeout = setTimeout(() => {
                    el.classList.remove('typing-active');
                  }, 400);
                  typewriterTimeouts.push(doneTimeout);
                }
              }
            }

            typeNextChar();
          }, cumulativeDelay);

          typewriterTimeouts.push(startTimeout);

          let lineDuration = text.length * 28 + 260;
          cumulativeDelay += lineDuration;
        });
      }

      function closeCardModal() {
        if (!cardModal || !cardModal.classList.contains('is-active')) return;
        if (card3D) card3D.classList.remove('is-card-open');
        cancelTypewriter();
        if (window.soundEngine) {
          window.soundEngine.playCardClose();
        }
        cardModal.classList.add('is-closing');
        setTimeout(() => {
          if (floatingCard) {
            floatingCard.classList.remove('is-emerged');
            floatingCard.classList.add('is-settled');
            floatingCard.classList.remove('is-hidden-modal');
            floatingCard.style.opacity = '';
          }
          cardModal.classList.remove('is-active');
          cardModal.classList.remove('is-closing');
        }, 1100);
      }

      // Constellations completion hook -> Trigger floating card emergence
      cosmicEngine.onConstellationsComplete = () => {
        if (svg && svg.classList.contains('is-box-open') && floatingCard) {
          if (window.soundEngine) {
            window.soundEngine.playCardEmerge();
          }
          floatingCard.classList.remove('is-hidden-modal');
          floatingCard.classList.remove('is-settled');
          floatingCard.style.opacity = '';
          floatingCard.classList.add('is-emerged');
          setTimeout(() => {
            if (floatingCard.classList.contains('is-emerged')) {
              floatingCard.classList.remove('is-emerged');
              floatingCard.classList.add('is-settled');
            }
          }, 3800);
        }
      };

      // Click floating card in the room -> Fly 3D into view
      if (floatingCard) {
        floatingCard.addEventListener('click', (e) => {
          e.stopPropagation();
          const canOpen = floatingCard.classList.contains('is-emerged') || floatingCard.classList.contains('is-settled');
          if (canOpen && cardModal) {
            if (window.soundEngine) {
              window.soundEngine.playCardFly();
            }
            // Measure actual floating card coordinates relative to viewport center
            const rect = floatingCard.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              const targetX = rect.left + rect.width / 2 - window.innerWidth / 2;
              const targetY = rect.top + rect.height / 2 - window.innerHeight / 2;
              document.documentElement.style.setProperty('--fly-x', `${Math.round(targetX)}px`);
              document.documentElement.style.setProperty('--fly-y', `${Math.round(targetY)}px`);
            }
            // Seamlessly hide in-room card while 3D modal card flies into view
            floatingCard.classList.add('is-hidden-modal');
            cardModal.classList.remove('is-closing');
            cardModal.classList.add('is-active');
          }
        });
      }

      // Click 3D card inside modal -> Toggle Fold / Unfold
      if (card3D) {
        card3D.addEventListener('click', (e) => {
          e.stopPropagation();
          const willOpen = !card3D.classList.contains('is-card-open');
          card3D.classList.toggle('is-card-open');
          if (willOpen) {
            if (window.soundEngine) {
              window.soundEngine.playPaperFlip();
            }
            startTypewriter();
          } else {
            if (window.soundEngine) {
              window.soundEngine.playCardClose();
            }
            cancelTypewriter();
          }
        });
      }

      // Close modal button
      if (closeCardBtn) {
        closeCardBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeCardModal();
        });
      }

      // Click backdrop to close
      if (cardModal) {
        cardModal.addEventListener('click', (e) => {
          if (e.target === cardModal) {
            closeCardModal();
          }
        });
      }

      let boxCloseTimer = null;

      function closeBoxGracefully() {
        if (!svg) return;
        if (window.soundEngine) {
          window.soundEngine.playBoxClose();
        }
        svg.classList.remove('is-box-open');
        svg.classList.remove('is-box-closing');
        void svg.offsetWidth; // trigger reflow
        svg.classList.add('is-box-closing');

        if (boxCloseTimer) clearTimeout(boxCloseTimer);
        boxCloseTimer = setTimeout(() => {
          svg.classList.remove('is-box-closing');
        }, 1500);

        if (floatingCard) {
          floatingCard.classList.remove('is-emerged');
          floatingCard.classList.remove('is-settled');
          floatingCard.classList.remove('is-hidden-modal');
          floatingCard.style.opacity = '0';
          setTimeout(() => {
            floatingCard.style.opacity = '';
          }, 800);
        }
        closeCardModal();
        cosmicEngine.stop();
      }

      // Click candle to toggle lighting / blowing out
      if (candle && svg) {
        candle.addEventListener('click', (e) => {
          e.stopPropagation();
          const wasLit = svg.classList.contains('is-lit');
          svg.classList.toggle('is-lit');

          if (wasLit) {
            if (window.soundEngine) {
              window.soundEngine.playCandleBlow();
            }
            // Kích hoạt nhạc nền ngay khi thổi tắt nến
            playBgm();

            // Blown out -> dismiss speech bubble and rise smoke + glow ember
            hideSpeechBubble();
            if (smoke) {
              smoke.classList.remove('animating');
              void smoke.offsetWidth; // trigger reflow
              smoke.classList.add('animating');
            }
            if (ember) {
              ember.classList.remove('animating');
              void ember.offsetWidth; // trigger reflow
              ember.classList.add('animating');
            }
          } else {
            if (window.soundEngine) {
              window.soundEngine.playCandleIgnite();
            }
            // Relit -> cancel smoke & ember immediately
            if (smoke) smoke.classList.remove('animating');
            if (ember) ember.classList.remove('animating');
          }

          // If candle is relit while box was open, gently close box & reset card
          if (!wasLit && svg.classList.contains('is-box-open')) {
            closeBoxGracefully();
          }
        });
      }

      // Click memory box
      if (box && svg) {
        box.addEventListener('click', (e) => {
          e.stopPropagation();

          // If candle is still lit, shake box and show comic speech bubble!
          if (svg.classList.contains('is-lit')) {
            if (window.soundEngine) {
              window.soundEngine.playBoxLocked();
            }
            box.classList.remove('shake');
            void box.offsetWidth; // trigger reflow
            box.classList.add('shake');
            showSpeechBubble();
            return;
          }

          // Candle is unlit -> Open / Close box normally
          hideSpeechBubble();
          if (svg.classList.contains('is-box-open')) {
            // Currently open -> close gracefully with arc animation
            closeBoxGracefully();
          } else {
            // Currently closed -> open
            if (window.soundEngine) {
              window.soundEngine.playBoxOpen();
            }
            svg.classList.remove('is-box-closing');
            if (boxCloseTimer) clearTimeout(boxCloseTimer);
            svg.classList.add('is-box-open');
            cosmicEngine.start();
          }
        });
      }

      // ======================================================================
      // BACKGROUND MUSIC (BGM) CONTROLLER LOGIC
      // ======================================================================
      const bgmAudio = document.getElementById('bgm-audio');
      const bgmBtn = document.getElementById('bgm-toggle-btn');
      let isBgmPlaying = false;

      function playBgm() {
        if (!bgmAudio) return;
        bgmAudio.volume = 0.45;
        const playPromise = bgmAudio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            isBgmPlaying = true;
            if (bgmBtn) bgmBtn.classList.add('is-playing');
          }).catch((err) => {
            console.log('BGM playback waiting for user gesture:', err);
          });
        }
      }

      function pauseBgm() {
        if (!bgmAudio) return;
        bgmAudio.pause();
        isBgmPlaying = false;
        if (bgmBtn) bgmBtn.classList.remove('is-playing');
      }

      function toggleBgm() {
        if (isBgmPlaying) {
          pauseBgm();
        } else {
          playBgm();
        }
      }

      if (bgmBtn) {
        bgmBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleBgm();
        });
      }
    });
  </script>
</body>

</html>
